services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lighthousepm-backend
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: dev
      APP_PORT: 8000
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/lighthouse
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: lighthousepm-postgres
    environment:
      POSTGRES_DB: lighthouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lighthouse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
