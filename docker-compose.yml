services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: "${LIGHTHOUSE_APP_ENV:-prod}"
      DEPLOYMENT_MODE: docker
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      CORS_ORIGINS: "${LIGHTHOUSE_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}"
      LIGHTHOUSE_CONFIG_FILE: /config/backend.env
      LIGHTHOUSE_API_TOKEN_FILE: /run/secrets/lighthouse_api_token
      DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/lighthouse
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - lighthouse_api_token
      - postgres_password
    volumes:
      - "${LIGHTHOUSE_CONFIG_DIR:?Set LIGHTHOUSE_CONFIG_DIR to a writable non-secret host configuration directory}:/config"
    ports:
      - "127.0.0.1:${LIGHTHOUSE_BACKEND_PORT:-8000}:8000"
    networks:
      - lighthousepm
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lighthouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - lighthousepm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lighthouse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

networks:
  lighthousepm:
    driver: bridge

secrets:
  lighthouse_api_token:
    file: ${LIGHTHOUSE_API_TOKEN_FILE:?Set LIGHTHOUSE_API_TOKEN_FILE to a protected host token file}
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE to a protected host password file}
