[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-release-signals-backend"
version = "0.1.0"
description = "Deterministic Jira release analytics and signal API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.137.2,<1.0",
  "starlette>=0.46,<2.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "python-dotenv>=1.0,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.27,<1.0",
  "apscheduler>=3.10,<4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "pyinstaller>=6.0,<7.0",
  "pip-tools>=7.6,<8.0"
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "postgres: tests requiring an explicit disposable PostgreSQL integration target",
  "docker: tests requiring an isolated disposable Docker Compose project",
]

[tool.mypy]
python_version = "3.11"
files = ["app"]
plugins = ["pydantic.mypy"]
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
